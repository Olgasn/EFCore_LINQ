version: '3.8'

services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "P@ssw0rd123!"
    ports:
      - "1433:1433"
